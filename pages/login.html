<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Digital Library</title>
    <link rel="stylesheet" href="../css/login.css">
</head>
<body>
    <header>
        <h1>Digital Library</h1> 
    </header>
    <main>
        <h2>Login</h2>
        <form id="loginForm">
            <input type="email" id="email" placeholder="User Email" required>
            <input type="password" id="password" placeholder="User Password" required>
            <button type="submit">Login</button>
        </form>
        <h1>If not a user? Please register</h1>
        <a href="../pages/register.html">To Register</a>
    </main>
    <footer>
        <p>
            © 2026 Digital Library Management System</p>
    </footer>
    <script src="../js/login.js"></script>
</body>
</html>
